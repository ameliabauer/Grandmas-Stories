<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#244849"/><stop offset="1" stop-color="#173839"/></linearGradient>
 <linearGradient id="wood" x2="1" y2="1"><stop stop-color="#81532f"/><stop offset=".45" stop-color="#54351f"/><stop offset="1" stop-color="#382316"/></linearGradient>
 <linearGradient id="seat" x2="0" y2="1"><stop stop-color="#d87945"/><stop offset="1" stop-color="#a94725"/></linearGradient>
 <pattern id="wallpaper" width="170" height="42" patternUnits="userSpaceOnUse"><path d="M0 9 Q42 2 85 9T170 9 M0 28 Q42 21 85 28T170 28" fill="none" stroke="#c69a66" stroke-opacity=".25" stroke-width="2"/></pattern>
